<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>312th Fred Layovers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F1; --panel:#F8FBFA; --ink:#1C3048; --muted:#5A6B78;
  --rule:#C9D6D2; --gold:#E0A820; --gold-ink:#8A5F00; --blue:#2F6FA5; --on-gold:#1C3048;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#13212E; --panel:#192B3A; --ink:#E4ECEF; --muted:#93A5B2;
    --rule:#2A3D4D; --gold:#F2C14E; --gold-ink:#F2C14E; --blue:#7DB3E0; --on-gold:#13212E;
  }
}
:root[data-theme="dark"]{
  --paper:#13212E; --panel:#192B3A; --ink:#E4ECEF; --muted:#93A5B2;
  --rule:#2A3D4D; --gold:#F2C14E; --gold-ink:#F2C14E; --blue:#7DB3E0; --on-gold:#13212E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}

header{padding:20px 20px 8px;max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sync{display:flex;align-items:center;gap:8px;text-align:right}
.sync-text{font-size:13px;line-height:1.3;color:var(--muted);max-width:150px}
.sync-text b{display:block;font-weight:600;color:var(--ink)}
.sync-text.bad b{color:var(--gold-ink)}
.refresh{all:unset;cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border:1.5px solid var(--rule);border-radius:8px;font-size:18px;color:var(--ink)}
.refresh:focus-visible{outline:2px solid var(--blue)}
.refresh.spin span{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header p{margin:0;color:var(--muted);font-size:15px}
header h1{margin:2px 0 0;font:700 26px/1.1 var(--cond);letter-spacing:.01em}

/* Station strip: drawn like an airway on an enroute chart */
.route{position:relative;overflow-x:auto;scrollbar-width:none;margin:14px 0 0;padding:6px 20px 14px}
.route::-webkit-scrollbar{display:none}
.route ol{position:relative;display:flex;gap:4px;list-style:none;margin:0;padding:0;width:max-content}
.route ol::before{content:"";position:absolute;left:22px;right:22px;top:15px;height:2px;background:var(--gold);opacity:.85}
.stn{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:76px;padding-bottom:4px;border-radius:6px}
.stn:focus-visible{outline:2px solid var(--blue)}
.stn .pt{width:14px;height:14px;margin:9px 0 8px;border-radius:50%;border:2px solid var(--gold-ink);background:var(--paper);position:relative;z-index:1;transition:transform .15s}
.stn b{font:700 17px/1 var(--cond);letter-spacing:.03em}
.stn small{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.stn[aria-pressed="true"] .pt{background:var(--gold);transform:scale(1.35)}
.stn[aria-pressed="true"] b{color:var(--gold-ink)}
.stn.new .pt{border-style:dashed;border-color:var(--blue)}
.stn.new b{color:var(--blue)}
.findloc{max-width:720px;margin:12px auto 0;padding:0 20px}
.findloc input{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.nomatch{align-self:flex-start;padding:8px 12px 0 4px;color:var(--muted);font-size:14px;max-width:220px;background:var(--paper);position:relative;z-index:1}
.nomatch .link{margin-top:2px}
.link{all:unset;cursor:pointer;display:inline-block;margin-top:6px;color:var(--blue);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link:focus-visible{outline:2px solid var(--blue)}
.hint{color:var(--muted);font-size:13px;margin-top:4px;display:block}

/* Station hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px;border-bottom:2px solid var(--ink)}
.hero .code{font:700 clamp(64px,19vw,104px)/.82 var(--cond);letter-spacing:-.01em;margin:0}
.hero .where{text-align:right;padding-bottom:4px}
.hero .where strong{display:block;font:600 18px/1.2 var(--sans)}
.hero .where span{color:var(--muted);font-size:14px}

/* Command post block */
.cp{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 0 10px}
.cp .lbl{display:block;font-size:13px;color:var(--muted);line-height:1.2}
.cp .name{font-weight:600;font-size:17px}
.freqbox{display:inline-block;margin-top:3px;font:700 22px/1 var(--cond);color:var(--blue);border:1.5px solid var(--blue);border-radius:4px;padding:4px 8px;letter-spacing:.03em}
.notes{padding:0 0 14px;border-bottom:1px solid var(--rule)}
.notes label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.notes textarea{display:block;width:100%;min-height:44px;overflow:hidden;resize:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;line-height:1.45}
.cp-empty{color:var(--muted)}
.mini{all:unset;cursor:pointer;margin-left:auto;border:1.5px solid var(--rule);border-radius:6px;padding:5px 12px;font-size:14px;font-weight:600}
.mini:focus-visible{outline:2px solid var(--blue)}
.cp-edit{flex-basis:100%;padding-top:4px}
.cp-edit .pair{display:grid;grid-template-columns:3fr 2fr;gap:10px}
@media (max-width:480px){.cp-edit .pair{grid-template-columns:1fr}}

/* Category tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 12px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.tab{all:unset;cursor:pointer;text-align:center;padding:10px 2px;font-weight:600}
@media (max-width:400px){.tab{font-size:14px}.tab span{display:block;margin:0}}
.tab+.tab{border-left:1.5px solid var(--ink)}
.tab span{font-weight:400;color:var(--muted);margin-left:4px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] span{color:inherit;opacity:.7}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-4px}

.tools{display:flex;gap:8px;margin-bottom:6px}
.tools input,.tools select{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:9px 12px}
.tools input{flex:1;min-width:0}

/* Entries */
.list{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:16px 0;border-bottom:1px solid var(--rule)}
.entry h3{margin:0;font:600 18px/1.3 var(--sans)}
.entry .area{color:var(--blue);font-size:14px;font-weight:500}
.entry p{margin:4px 0 0;grid-column:1;max-width:60ch}
.entry .acts{grid-column:1;margin-top:6px}
.entry .acts .mini{margin-left:0}
#fNote{overflow:hidden;resize:none}
.vote{grid-row:1/span 3;grid-column:2;align-self:start;display:flex;flex-direction:column;align-items:center;gap:3px}
.vote button{all:unset;cursor:pointer;width:42px;height:30px;display:grid;place-items:center;border:1.5px solid var(--rule);border-radius:8px;font-size:13px;color:var(--muted)}
.vote button:focus-visible{outline:2px solid var(--blue)}
.vote .up[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--paper)}
.vote .dn[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--on-gold)}
.vote b{font:700 20px/1.1 var(--cond)}
.vote b.neg{color:var(--gold-ink)}
.tally{grid-column:1;color:var(--muted);font-size:13px}
.warn{display:inline-block;margin-top:6px;padding:2px 8px;border:1.5px solid var(--gold-ink);border-radius:6px;color:var(--gold-ink);font-size:13px;font-weight:600}

.empty{padding:40px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:12px}

/* Add button + sheet */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--on-gold);border:0;border-radius:28px;padding:14px 22px;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(176,125,11,.35)}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:12px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--panel);border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:92vh;overflow:auto}
.sheet.open{transform:none}
.sheet h2{margin:0 0 14px;font:700 24px/1.1 var(--cond)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea,.cp-edit input{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.field textarea{min-height:76px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:400px){.seg{grid-template-columns:1fr 1fr}}
.seg label{flex:1}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:9px;border:1.5px solid var(--rule);border-radius:8px;font-weight:600;cursor:pointer}
.seg input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg input:focus-visible+span{outline:2px solid var(--blue)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn.danger{margin-right:auto;background:transparent;color:var(--gold-ink);border:1.5px solid var(--gold-ink)}
.btn.danger.armed{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.where .mini{margin:6px 0 0}
.lock{background:var(--rule)!important;color:var(--muted)}
.err{color:var(--gold-ink);font-size:14px;min-height:1.2em;margin:0 0 6px}

.toast{position:fixed;z-index:60;width:max-content;max-width:min(90vw,420px);text-align:center;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- Cover page ---------- */
body.covered{overflow:hidden}
.cover{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 40%,#1B3347 0%,#10202D 70%);color:#E9F0F2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  transition:opacity .5s ease, transform .5s ease}
.cover.leaving{opacity:0;transform:translateY(-3%)}
.cover-logo{position:absolute;left:50%;top:50%;width:min(78vmin,560px);height:auto;transform:translate(-50%,-50%);opacity:.12;pointer-events:none;user-select:none}
.sky{position:absolute;inset:0;pointer-events:none}
.plane{position:absolute;left:0;display:flex;align-items:center;animation:fly linear infinite;will-change:transform}
.plane svg{display:block;width:100%;height:100%;fill:#D6E4EC}
.plane i{display:block;height:2px;margin-right:-4px;background:linear-gradient(90deg,transparent,rgba(214,228,236,.35));border-radius:2px}
@keyframes fly{from{transform:translateX(-45vw) rotate(var(--r,0deg))}to{transform:translateX(125vw) rotate(var(--r,0deg))}}
.cover-text{position:relative;z-index:1;max-width:30ch}
.cover-text p{margin:0;font-size:16px;color:#A9BCC8}
.cover-text h1{margin:6px 0 10px;font:700 clamp(52px,14vw,96px)/.9 var(--cond);letter-spacing:.005em;color:#fff}
.cover-text .sub{font-size:17px;color:#C9D7DF;margin-bottom:28px}
.enter{background:#F2C14E;color:#13212E;border:0;border-radius:28px;padding:14px 30px;font-weight:600;font-size:17px;cursor:pointer}
.enter:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.plane{animation:none}.cover{transition:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- Data layer: Cloudflare Worker + D1 (sample data when API_URL is empty) ---------- */
async function api(method, path, body){
  const opt = {method};
  if(method!=='GET') opt.headers = {'X-Post-Code':POST_CODE};   // writes carry the squadron code
  if(body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  opt.cache = 'no-store';
  let r;
  try{ r = await fetch(API_URL.replace(/\/$/,'') + path, opt); }
  catch(e){ throw new Error("Can't reach the server. Check the internet connection, or ALLOWED_ORIGIN on the Worker."); }
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || `Server returned ${r.status}`);
  markSynced();
  return d;
}
let lastSync = null;
function hhmm(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+p(d.getMinutes()); }
function setSync(title, detail, bad){
  $('syncText').className = 'sync-text' + (bad ? ' bad' : '');
  $('syncText').innerHTML = `<b>${esc(title)}</b>${esc(detail||'')}`;
  $('syncText').title = detail || '';
}
function markSynced(){
  lastSync = new Date();
  const d = lastSync, p = n=>String(n).padStart(2,'0');
  const date = `${d.getDate()} ${d.toLocaleString('en-US',{month:'short'})} ${d.getFullYear()}`;
  setSync('Last updated', `${date}, ${p(d.getHours())}:${p(d.getMinutes())}`);
}
async function loadAll(){
  if(!API_URL){ setSync('Sample data', 'Not connected'); return; }
  try{
    const d = await api('GET','/data');
    entries = d.entries || [];
    if(d.stations && d.stations.length){
      STATIONS.length = 0;
      d.stations.forEach(s=>STATIONS.push(s));
      if(!STATIONS.some(s=>s.code===state.loc)) state.loc = STATIONS[0].code;
      fillLocSelect();
    }
    return true;
  }catch(e){
    setSync('Not updated', e.message.startsWith("Can't reach") ? "Can't reach server" : 'Server error', true);
    toast(e.message, 6000);
    return false;
  }
}
async function saveStation(st){
  if(API_URL) await api('POST','/stations',{icao:st.code, city:st.city, region:st.region||'',
                                            cpName:st.cp?.name||'', cpFreq:st.cp?.freq||''});
  STATIONS.push(st); return true;
}
async function saveCP(code, cp){
  if(API_URL) await api('PUT',`/stations/${code}`,{cpName:cp.name||'', cpFreq:cp.freq||''});
  STATIONS.find(x=>x.code===code).cp = cp; return true;
}
async function saveNotes(code, notes){
  if(API_URL) await api('PUT',`/stations/${code}`,{notes});
  const st = STATIONS.find(x=>x.code===code);
  st.cp = {...(st.cp||{}), notes}; return true;
}
async function updateEntry(id, fields){
  if(API_URL) await api('PUT',`/entries/${encodeURIComponent(id)}`,fields);
  Object.assign(entries.find(x=>x.id===id), fields); return true;
}
async function saveEntry(e){
  if(API_URL){
    const d = await api('POST','/entries',{loc:e.loc, cat:e.cat, name:e.name, area:e.area, note:e.note});
    e.id = d.id; e.date = d.created;     // server assigns the id and time
  }
  entries.unshift(e); return true;
}
async function deleteEntry(id){
  if(API_URL) await api('DELETE',`/entries/${encodeURIComponent(id)}`);
  entries = entries.filter(x=>x.id!==id);
  myVote.delete(id); rememberVotes();
}
async function updateStationInfo(code, fields){
  if(API_URL) await api('PUT',`/stations/${code}`,fields);
  Object.assign(STATIONS.find(x=>x.code===code), fields);
}
async function deleteStation(code){
  if(API_URL) await api('DELETE',`/stations/${code}`);
  const i = STATIONS.findIndex(x=>x.code===code);
  if(i>=0) STATIONS.splice(i,1);
  entries = entries.filter(x=>x.loc!==code);
}
async function saveVote(id, dir, prev){
  if(!API_URL) return;
  const d = await api('POST',`/entries/${encodeURIComponent(id)}/vote`,{dir, prev});
  const it = entries.find(x=>x.id===id);
  if(it && (it.up!==d.up || it.down!==d.down)){ it.up = d.up; it.down = d.down; renderList(); }  // sync with other voters
}

function matchStations(){
  const q = state.locQ.trim().toLowerCase();
  if(!q) return STATIONS;
  return STATIONS.filter(s=>(s.code+' '+s.city+' '+(s.region||'')).toLowerCase().includes(q));
}
function renderStations(){

      <i class="pt"></i><b>${esc(s.code)}</b><small>${esc(s.city)}</small></button></li>`).join('') +
    `<li><button class="stn new" data-newloc aria-label="Add a location"><i class="pt"></i><b>+</b><small>New</small></button></li>`;
}
function renderHero(){

function renderNotes(){

const validFreq = f => f.split(/[\/,]/).every(x=>{ x=x.trim(); const n=+x; return /^\d{1,3}(\.\d{1,3})?$/.test(x) && n>=2 && n<=400; });
let cpEditFor = null;   // station code whose CP block is in edit mode

function renderCP(){
  const s = STATIONS.find(x=>x.code===state.loc), c = s.cp;
  if(cpEditFor===s.code){
    $('cp').innerHTML = `<form class="cp-edit" id="cpForm" novalidate>
      <div class="pair">
        <label class="field"><span>Command post name</span><input id="cpName" maxlength="40" value="${esc(c?.name||'')}" placeholder="e.g. ${esc(s.city)} Command Post"></label>
        <label class="field"><span>Frequency</span><input id="cpFreq" maxlength="40" value="${esc(c?.freq||'')}" placeholder="e.g. 311.0 / 128.55"></label>
      </div>
      <p class="err" id="cpErr" role="alert"></p>
      <div class="row"><button type="button" class="btn ghost" data-cpcancel>Cancel</button><button type="submit" class="btn">Save command post</button></div>
    </form>`;
    return;
  }
  if(!c || (!c.name && !c.freq)){
    $('cp').innerHTML = `<span class="cp-empty">No command post info for ${esc(s.code)} yet.</span>
      <button class="mini" data-cpedit>Add</button>`;
    return;
  }

    <div><span class="lbl">Command post</span><span class="name">${esc(c.name||'Name not set')}</span></div>
    <div><span class="lbl">Frequency</span><span class="freqbox">${esc(c.freq||'None')}</span></div>
    <button class="mini" data-cpedit aria-label="Edit command post for ${esc(s.code)}">Edit</button>`;
}
function renderTabs(){
  const here = entries.filter(e=>e.loc===state.loc);
  $('tabs').innerHTML = CATS.map(c=>`
    <button class="tab" role="tab" data-cat="${c.id}" aria-selected="${c.id===state.cat}">
      ${c.label}<span>${here.filter(e=>e.cat===c.id).length}</span></button>`).join('');
}
function renderList(){
  const q = state.q.toLowerCase();
  let rows = entries.filter(e=>e.loc===state.loc && e.cat===state.cat &&
    (!q || (e.name+' '+e.area+' '+e.note).toLowerCase().includes(q)));
  const score = e=>e.up-e.down;
  rows.sort(state.sort==='score' ? (a,b)=>score(b)-score(a)||b.up-a.up : (a,b)=>new Date(b.date)-new Date(a.date));
  if(!rows.length){
    const label = CATS.find(c=>c.id===state.cat).label.toLowerCase();
    $('list').innerHTML = `<li class="empty">${q ? 'Nothing matches that search.' :
      `No ${label} spots at ${state.loc} yet.`}<br><button class="btn ghost" data-add>Add the first one</button></li>`;
    return;
  }
  $('list').innerHTML = rows.map(e=>{
    const v = myVote.get(e.id)||0, sc = e.up-e.down;
    const bad = e.down>=5 && e.down>e.up*2;
    return `<li class="entry">
      <div><h3>${esc(e.name)}</h3><div class="area">${esc(e.area)}</div></div>
      <div class="vote">
        <button class="up" data-vote="1" data-id="${e.id}" aria-pressed="${v===1}" aria-label="Upvote ${esc(e.name)}">&#9650;</button>
        <b class="${sc<0?'neg':''}" aria-label="Score">${sc}</b>
        <button class="dn" data-vote="-1" data-id="${e.id}" aria-pressed="${v===-1}" aria-label="Downvote ${esc(e.name)}">&#9660;</button>
      </div>
      <p>${esc(e.note)}</p>
      <div class="acts"><button class="mini" data-edit="${e.id}" aria-label="Edit ${esc(e.name)}">Edit</button></div>
      <div class="tally">${e.up} up, ${e.down} down${bad?'<br><span class="warn">Crews say skip it</span>':''}</div>
    </li>`;}).join('');
}
function render(){ renderStations(); renderHero(); renderCP(); renderNotes(); renderTabs(); renderList(); }

function pickStation(code){
  state.loc = code; cpEditFor = null;
  if(state.locQ){ state.locQ = ''; $('locQ').value = ''; }
  render();
  const b = document.querySelector(`[data-loc="${code}"]`);
  if(b) b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});

  if(e.key!=='Enter') return;

  const m = matchStations();

});
$('tabs').addEventListener('click',e=>{

$('list').addEventListener('click',e=>{
  if(e.target.closest('[data-add]')) return openSheet();
  const ed = e.target.closest('[data-edit]');
  if(ed) return openSheet(entries.find(x=>x.id===ed.dataset.edit));
  const b = e.target.closest('[data-vote]'); if(!b) return;
  const it = entries.find(x=>x.id===b.dataset.id), dir = +b.dataset.vote, prev = myVote.get(it.id)||0;
  if(prev===1) it.up--; if(prev===-1) it.down--;          // undo old vote
  const next = prev===dir ? 0 : dir;                      // tap same arrow again = clear
  if(next){ myVote.set(it.id,next); next===1 ? it.up++ : it.down++; } else myVote.delete(it.id);
  rememberVotes(); renderList();
  saveVote(it.id, next, prev).catch(err=>toast('Vote not saved: ' + err.message));
});

let backToSpot = false, editLocCode = null;
function openLoc(fromSpot, prefill, editCode){
  backToSpot = fromSpot; editLocCode = editCode || null;
  $('locSheet').reset(); $('lErr').textContent = '';
  const st = editCode && STATIONS.find(x=>x.code===editCode);
  $('locTitle').textContent = st ? `Edit ${st.code}` : 'Add a location';
  $('locSubmit').textContent = st ? 'Save changes' : 'Add location';
  $('lCode').readOnly = !!st; $('lCode').classList.toggle('lock', !!st);
  $('lHint').textContent = st ? 'The ICAO code can\'t be changed. Delete and re-add the location if it\'s wrong.' : 'Four characters, like the ones across the top.';
  $('lCpFields').hidden = !!st;          // command post has its own Edit button on the page
  disarm($('delLoc')); $('delLoc').hidden = !st;
  if(st){ $('lCode').value = st.code; $('lCity').value = st.city; $('lRegion').value = st.region||''; }
  if(prefill){
    if(/^[A-Za-z][A-Za-z0-9]{3}$/.test(prefill)) $('lCode').value = prefill.toUpperCase();
    else $('lCity').value = prefill;
  }
  $('sheet').classList.remove('open');
  $('scrim').classList.add('open'); $('locSheet').classList.add('open');
  setTimeout(()=>(st ? $('lCity') : $('lCode')).focus(),250);
}
function leaveLoc(){
  $('locSheet').classList.remove('open');
  if(backToSpot) $('sheet').classList.add('open'); else $('scrim').classList.remove('open');
}

$('locSheet').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(editLocCode){
    const f = {city:$('lCity').value.trim(), region:$('lRegion').value.trim()};
    if(!f.city) return $('lErr').textContent = 'Add the base or city name.';
    try{ await updateStationInfo(editLocCode, f); }
    catch(err){ return $('lErr').textContent = 'Not saved: ' + err.message; }
    fillLocSelect(); closeSheet(); render(); toast(`${editLocCode} updated`);
    return;
  }
  const st = {code:$('lCode').value.trim(), city:$('lCity').value.trim(), region:$('lRegion').value.trim()};
  const cpName = $('lCpName').value.trim(), cpFreq = $('lCpFreq').value.trim();
  if(cpFreq && !validFreq(cpFreq)) return $('lErr').textContent = 'Enter frequencies in MHz, like 311.0. Separate more than one with a slash.';
  if(cpName || cpFreq) st.cp = {name:cpName, freq:cpFreq, notes:''};
  if(!/^[A-Z][A-Z0-9]{3}$/.test(st.code)) return $('lErr').textContent = 'Enter a four-character ICAO code that starts with a letter.';
  const dup = STATIONS.find(x=>x.code===st.code);
  if(dup) return $('lErr').textContent = `${st.code} is already listed as ${dup.city}.`;
  if(!st.city) return $('lErr').textContent = 'Add the base or city name.';
  try{ await saveStation(st); }
  catch(err){ return $('lErr').textContent = 'Not saved: ' + err.message; }
  fillLocSelect();
  state.locQ = ''; $('locQ').value = '';
  toast(`${st.code} added`);
  if(backToSpot){
    renderStations(); $('fLoc').value = st.code;
    $('locSheet').classList.remove('open'); $('sheet').classList.add('open');
  } else {
    state.loc = st.code; cpEditFor = null; closeSheet(); render();

});

$('sheet').addEventListener('submit',async ev=>{

    catch(err){ return $('err').textContent = 'Not saved: ' + err.message; }
    state.loc = fields.loc; state.cat = fields.cat;
    editId = null; render(); closeSheet(); $('sheet').reset();
    return toast('Changes saved');
  }
  const e = {
    id:'u'+Date.now(), loc:$('fLoc').value,
    cat:document.querySelector('#fCat input:checked').value,
    name:$('fName').value.trim(), area:$('fArea').value.trim(),
    note:$('fNote').value.trim(),
    date:new Date().toISOString(), up:0, down:0
  };
  if(!e.name) return $('err').textContent = 'Add a name for the spot.';
  try{
    await saveEntry(e);
    state.loc = e.loc; state.cat = e.cat; state.q = ''; $('q').value = '';
    render(); closeSheet(); $('sheet').reset();
    toast(`Spot added to ${e.loc}`);
  }catch(err){ $('err').textContent = 'Not saved: ' + err.message; }
});

let tt;
function toast(msg, ms=2200){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),ms); }


/* ---------- Delete (tap once to arm, again to confirm) ---------- */
function disarm(b){ clearTimeout(b._t); b.classList.remove('armed'); b.textContent = 'Delete'; if(b.id==='delLoc') $('lErr').textContent = ''; }
function armed(b, label){
  if(b.classList.contains('armed')){ disarm(b); return true; }
  b.classList.add('armed'); b.textContent = label;
  clearTimeout(b._t); b._t = setTimeout(()=>disarm(b), 4000);
  return false;
}
$('delSpot').addEventListener('click', async ()=>{
  const b = $('delSpot');
  if(!armed(b, 'Tap to confirm')) return;
  const it = entries.find(x=>x.id===editId); if(!it) return;
  try{ await deleteEntry(it.id); }
  catch(err){ return $('err').textContent = 'Not deleted: ' + err.message; }
  editId = null; closeSheet(); $('sheet').reset(); render();
  toast(`${it.name} deleted`);
});
$('editLoc').addEventListener('click', ()=>openLoc(false, '', state.loc));
$('delLoc').addEventListener('click', async ()=>{
  const b = $('delLoc'), code = editLocCode;
  if(STATIONS.length<=1) return $('lErr').textContent = 'You need at least one location.';
  const n = entries.filter(x=>x.loc===code).length;
  if(!armed(b, 'Tap to confirm')){
    if(b.classList.contains('armed')) $('lErr').textContent = n ? `This deletes ${code} and all ${n} of its spots for everyone.` : `This deletes ${code} for everyone.`;
    return;
  }
  try{ await deleteStation(code); }
  catch(err){ return $('lErr').textContent = 'Not deleted: ' + err.message; }
  editLocCode = null; state.loc = STATIONS[0].code; cpEditFor = null;
  fillLocSelect(); closeSheet(); render();
  toast(`${code} deleted`);
});

  <i style="width:${f.size*1.6}px"></i><div style="width:${f.size}px;height:${f.size}px">${C5}</div></div>`).join('');

function enterSite(){
  const c = $('cover'); if(!c) return;
  c.classList.add('leaving');
  document.body.classList.remove('covered');
  setTimeout(()=>c.remove(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 500);
}
$('enter').addEventListener('click', enterSite);

async function forceUpdate(){
  const b = $('refresh');
  if(b.classList.contains('spin')) return;
  b.classList.add('spin'); setSync('Updating…','');
  const ok = await loadAll();
  b.classList.remove('spin');
  // don't wipe a form someone is filling in
  if(!$('sheet').classList.contains('open') && !$('locSheet').classList.contains('open') && cpEditFor===null) render();
  else { renderStations(); renderHero(); renderTabs(); renderList(); }
  if(ok) toast('Up to date');
}
$('refresh').addEventListener('click', forceUpdate);
// pull fresh data when someone comes back to the tab
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && API_URL && lastSync && Date.now()-lastSync > 60000) forceUpdate();
});

loadAll().then(render);
</script>
